<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETag 監看系統</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --warning-color: #d97706;
            --error-color: #dc2626;
            --maintenance-color: #6b7280;
        }

        body {
            background-color: #f3f4f6;
            min-height: 100vh;
        }

        .dashboard-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-latest {
            background-color: var(--success-color);
            color: white;
        }

        .status-outdated {
            background-color: var(--warning-color);
            color: white;
        }

        .status-error {
            background-color: var(--error-color);
            color: white;
        }

        .status-maintenance {
            background-color: var(--maintenance-color);
            color: white;
        }

        .endpoint-card {
            border-left: 4px solid transparent;
        }

        .endpoint-card.latest {
            border-left-color: var(--success-color);
        }

        .endpoint-card.outdated {
            border-left-color: var(--warning-color);
        }

        .endpoint-card.error {
            border-left-color: var(--error-color);
        }

        .endpoint-card.maintenance {
            border-left-color: var(--maintenance-color);
        }

        .history-table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #1e293b;
        }

        .history-table tr:hover {
            background-color: #f8fafc;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 頂部資訊列 -->
        <div class="dashboard-card p-6 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-chart-line mr-2"></i>
                        ETag 監看系統
                    </h1>
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-500">系統狀態：</span>
                        <span id="systemStatus" class="status-badge status-latest">正常</span>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-center">
                        <div class="text-sm text-gray-500">現在時間</div>
                        <div id="currentTime" class="text-lg font-semibold text-gray-900">--:--:--</div>
                    </div>
                    <div class="text-center">
                        <div class="text-sm text-gray-500">下次檢查</div>
                        <div id="nextCheck" class="text-lg font-semibold text-primary-600">--:--</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="dashboard-card p-6 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <button id="checkNow" class="btn-primary flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i>
                        立即檢查
                    </button>
                    <button id="clearHistory" class="btn-danger flex items-center gap-2">
                        <i class="fas fa-trash-alt"></i>
                        清除歷史記錄
                    </button>
                </div>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="enableSound" class="form-checkbox" checked>
                        <span class="text-sm text-gray-700">啟用錯誤音效</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="enableNotifications" class="form-checkbox" checked>
                        <span class="text-sm text-gray-700">啟用桌面通知</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="enableAutoUpdate" class="form-checkbox" checked>
                        <span class="text-sm text-gray-700">自動更新</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 端點監控網格 -->
        <div id="endpointGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
            <!-- 端點卡片將由 JavaScript 動態生成 -->
        </div>

        <!-- 歷史記錄 -->
        <div class="dashboard-card p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-900">
                    <i class="fas fa-history mr-2"></i>
                    檢查歷史記錄
                </h2>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-500">顯示：</span>
                    <select id="historyFilter" class="form-select text-sm">
                        <option value="all">全部記錄</option>
                        <option value="error">僅錯誤</option>
                        <option value="outdated">僅過期</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="history-table w-full">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left">時間</th>
                            <th class="px-4 py-3 text-left">端點</th>
                            <th class="px-4 py-3 text-left">狀態</th>
                            <th class="px-4 py-3 text-left">ETag</th>
                            <th class="px-4 py-3 text-left">最後修改時間</th>
                            <th class="px-4 py-3 text-left">操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- 歷史記錄將由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 通知元素 -->
    <div id="notification" class="notification">
        <div class="flex items-center gap-3">
            <i class="fas fa-bell text-primary-600"></i>
            <div class="notification-content"></div>
        </div>
    </div>

    <!-- 錯誤音效 -->
    <audio id="errorSound" preload="auto">
        <source src="error.mp3" type="audio/mpeg">
    </audio>

    <script src="monitor.js"></script>
</body>
</html>
