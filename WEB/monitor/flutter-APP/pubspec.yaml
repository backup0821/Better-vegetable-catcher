name: etag_monitor
description: ETag 監看系統 - 即時監控網站更新狀態
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.1.0
  intl: ^0.18.1
  shared_preferences: ^2.2.0
  audioplayers: ^5.2.0
  cupertino_icons: ^1.0.2
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding
      path: plugins/window_size

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Digital-7
      fonts:
        - asset: assets/fonts/digital-7.ttf 