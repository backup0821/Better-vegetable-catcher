<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS 測試頁面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CORS 測試頁面</h1>
            <div class="controls">
                <div class="api-select">
                    <label for="apiSelect">選擇 API：</label>
                    <select id="apiSelect">
                        <option value="https://data.moa.gov.tw/api/v1/AgriProductsTransType/">農業部原始 API</option>
                        <option value="https://bvc-api.deno.dev">備用 API</option>
                        <option value="https://backup0821.github.io/API/Better-vegetable-catcher/marketTV-drvice.json">TV 版本 API</option>
                    </select>
                </div>
                <div class="cors-select">
                    <label for="corsMode">CORS 模式：</label>
                    <select id="corsMode">
                        <option value="direct">直連</option>
                        <option value="proxy">CORS Proxy</option>
                    </select>
                </div>
                <button id="refreshBtn">重新整理資料</button>
                <div class="loading" id="loadingIndicator" style="display: none;">載入中...</div>
            </div>
        </header>

        <main>
            <div class="error-message" id="errorMessage" style="display:none;"></div>
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>交易日期</th>
                            <th>作物名稱</th>
                            <th>市場名稱</th>
                            <th>平均價格</th>
                            <th>交易量</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 資料將由 JavaScript 動態填入 -->
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>資料來源：行政院農業委員會農產品交易行情站</p>
            <p>最後更新時間：<span id="lastUpdateTime">-</span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
