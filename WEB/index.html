    <title>停用公告</title>
    <style>
        body {
            font-family: monocraft, sans-serif;
            background: linear-gradient(to right, hsl(0, 100%, 84%), #d0b5e9);
            filter: blur(0px);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: filter 1s ease-in-out;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: absolute;
            width: 0%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 0;
            transition: opacity 1s ease-in-out;
        }
        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 0%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .report {
            display: none;
            background-color: #ffffff31;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            z-index: 0;
            transition: opacity 1s ease-in-out;
        }
        .report.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .report img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .report h2 {
            margin-top: 0;
        }
    </style>
</head>
